name: background_remover
description: A Flutter app for removing and replacing image backgrounds.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  image_picker: ^1.0.7
  image: ^4.1.7
  photo_view: ^0.14.0
  share_plus: ^7.2.2
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
