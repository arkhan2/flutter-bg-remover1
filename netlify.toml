[build]
  command = """
    git clone --branch 3.38.2 --depth 1 https://github.com/flutter/flutter.git .flutter-sdk
    export PATH="$PWD/.flutter-sdk/bin:$PATH"
    flutter config --no-analytics
    flutter precache --web
    flutter pub get
    flutter build web --release --base-href /
    """
  publish = "build/web"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
